services:
  postgres:
    image: postgres:16-alpine
    container_name: ServiceCRM-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-ServiceCRM}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: ServiceCRM-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: