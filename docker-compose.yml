services:
  postgres:
    image: postgres:16-alpine
    container_name: ServiceCRM-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-ServiceCRM}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: ServiceCRM-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ServiceCRM-backend
    restart: always
    ports:
      - "5041:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME:-ServiceCRM};Username=${DB_USER:-postgres};Password=${DB_PASSWORD}
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-ServiceCRM}
      - Jwt__Audience=${JWT_AUDIENCE:-ServiceCRM}
      - Jwt__ExpireHours=${JWT_EXPIRE_HOURS:-8}
      - Admin__Username=${ADMIN_USERNAME:-admin}
      - Admin__Password=${ADMIN_PASSWORD:-AdminPassword2026!}
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ServiceCRM-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
